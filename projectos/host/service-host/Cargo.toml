[package]
name = "projectos-host-service-host"
version = "0.0.0"
edition = "2021"
publish = false
license = "UNLICENSED"
description = "CD-B4-PROJECTOSHOST-SERVICE-RUNTIME1A. The packaged ProjectOSHost.exe: the MINIMUM genuine Windows SCM-compatible service. It registers a service dispatcher and a control handler, publishes StartPending/Running/StopPending/Stopped, and runs an inert loop until the SCM asks it to stop. It performs NO protected effect: no file, registry, network, IPC, ProgramData, ACL, SID, key-provisioning, authority-acquisition, service-creation or UI route exists. Console mode holds no service status handle, so it can never publish an SCM state or impersonate an authoritative instance. Installing and starting the service remains the installer's job, gated behind InstallationEffectAuthority. Unsafe is confined to src/scm.rs."

[lints.rust]
# Unsafe is confined to src/scm.rs (the three Windows service calls); every unsafe op needs an explicit
# inner block. The crate cannot `forbid` it because the SCM boundary genuinely requires it.
unsafe_op_in_unsafe_fn = "deny"

[[bin]]
name = "ProjectOSHost"
path = "src/main.rs"

[dependencies]
# The FROZEN installation effect authority. Reused so the artefact reports the same value the installer
# composition gates on, rather than restating it.
projectos-host-windows-service-installation-contract = { path = "../windows-service-installation-contract" }

[target.'cfg(windows)'.dependencies]
# Exactly the service surface this binary uses: the dispatcher, the control handler and status
# reporting. No SCM management, registry, ACL, SID, pipe or network feature.
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_System_Services",
] }
