[package]
name = "projectos-host-windows-owner-verification"
version = "0.0.0"
edition = "2021"
publish = false
license = "UNLICENSED"
description = "INERT Windows owner-verification adapter crate (CD-B4-WINDOWS-USER-VERIFICATION-ADAPTER1A). Owns the opaque TrustedControlCentreWindowBinding input contract and the opaque VerifiedWindowsOwnerEvidence output, the typed UserConsentVerifier availability/result mappings (every non-success value fails closed), the window/process/session/owner-SID policy (local console only), the MTA-worker completion contract, the CSPRNG (BCryptGenRandom) trusted nonce with bounded volatile zeroisation, and the canonical domain-separated SHA-256 proof digest. It is INERT: the default production graph exposes NO externally callable live-verification function and NO way to construct VerifiedWindowsOwnerEvidence or a real TrustedControlCentreWindowBinding; synthetic construction is #[cfg(test)]-only and reaches no downstream crate. It acquires NO capability, mints NO grant, performs NO real UserConsentVerifier ceremony, resolves NO SID at rest, exposes NO raw HWND/SID/nonce/token, touches NO Tauri/src-tauri/core, opens NO pipe, queries NO SCM, and performs NO installation or protected effect. EXECUTION_READY stays false; installation stays NotAuthorised."

# unsafe is REQUIRED only by the live owner-verification FFI and is confined to src/verification_ffi.rs.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[features]
# LIVE WINDOWS OWNER VERIFICATION: links the `windows` crate and compiles the real UserConsentVerifier /
# interop / MTA / Win32 window-process-session-SID / BCryptGenRandom FFI. Non-default, so the default build
# stays the inert contract and links NO windows dependency and calls NO Windows API. Compiling this feature
# is NOT authority to run a verification: there is no externally callable live entrypoint and no evidence
# constructor in any graph, and the tests never invoke the ceremony.
windows-live-owner-verification = ["dep:windows", "dep:windows-future"]

[dependencies]
# Canonical proof-digest hash only (repository-pinned). No other runtime dependency: no thiserror, no
# getrandom/rand, no zeroize, no Tauri, no core, no windows-sys.
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
# The WinRT async-completion type (`IAsyncOperation`) with the blocking `get()`, so the MTA worker (§4
# Model A) completes without a message pump. It is windows-rs's own async crate (a transitive dependency of
# `windows`), named explicitly here only so the generic interop return type can be spelled; it is NOT an
# async executor/runtime. Optional + feature-gated: linked ONLY under `windows-live-owner-verification`.
windows-future = { version = "0.2.1", optional = true }
# Owner-verification Win32 + WinRT surface only, linked ONLY under `windows-live-owner-verification` so the
# default build pulls no windows dependency. Exactly the nine features the adapter uses; no SCM, no pipe, no
# registry, no ACL, no network feature.
windows = { version = "0.61.3", optional = true, features = [
    "Security_Credentials_UI",
    "Foundation",
    "Win32_Foundation",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Security_Cryptography",
] }
