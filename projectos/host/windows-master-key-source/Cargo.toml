[package]
name = "projectos-host-windows-master-key-source"
version = "0.0.0"
edition = "2021"
publish = false
description = "Production Windows master-key MATERIAL SOURCE for the future ProjectOS Host Service. Implements the accepted projectos-host-windows-crypto-adapter MasterKeyMaterialSource by generating exactly one fresh 32-byte candidate via the Windows system-preferred CNG RNG (BCryptGenRandom + BCRYPT_USE_SYSTEM_PREFERRED_RNG), yielded ONLY through the accepted closure-scoped borrow and zeroised on every exit path. NO deterministic/pseudo/caller/env/config fallback, NO retry, NO owned-byte return, NO DPAPI/persistence/lifecycle/handle/authority, NO service/IPC/registry/filesystem/credential. Candidate generation ONLY: it does not protect, persist, register, or activate a real service master key. No secure-erasure or credential-custody claim."
license = "UNLICENSED"

[lints.rust]
# Unsafe is confined to src/windows_rng.rs (allowed at its module declaration); the rest of the crate
# denies it, and every unsafe op needs an explicit inner `unsafe`.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[dependencies]
projectos-host-windows-crypto-adapter = { path = "../windows-crypto-adapter" }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography"] }
