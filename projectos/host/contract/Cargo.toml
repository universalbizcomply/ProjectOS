[package]
name = "projectos-trust-contract"
version = "0.0.0"
edition = "2021"
publish = false
description = "Authority-free wire contract between the ProjectOS Control Centre client and the future independent ProjectOS Host Service. Defines request/response/evidence/error shapes only; contains NO authority, NO secrets, NO capabilities, NO verification logic."
license = "UNLICENSED"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
