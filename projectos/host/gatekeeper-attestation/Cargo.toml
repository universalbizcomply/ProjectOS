[package]
name = "projectos-host-gatekeeper-attestation"
version = "0.0.0"
edition = "2021"
publish = false
license = "UNLICENSED"
description = "RUN-TO-COMPLETION HOST ATTESTATION. The bounded gatekeeper REQUEST INBOX contract: how ProjectOSHost derives a request file's identity from trusted request identity rather than from a caller-supplied path, bounds its size, reads it exactly once, binds those exact in-memory bytes to the parameter digest carried on the 512-byte authority wire, and consumes it one-shot so a stale file can never authorise a later call. PURE LOGIC: it opens no file, creates no directory, changes no ACL, spawns no process, holds no credential and performs no Windows call — the filesystem is an injected port so every property here is provable without touching disk."

[lints.rust]
unsafe_code = "forbid"

[features]
# FIXTURE GRAPH ONLY, non-default, enabled by no shipped graph. Exposes steps 4-8 of the review
# operation so a dependent crate can prove the responder and the sealed execution seam; the public
# production path still begins with the owner's signature.
test-fixtures = []

[dependencies]
# The response record's canonical encoding and the review subject's strict parse. Both already in the
# host tree's lock graph (host-identity, persistence, gatekeeper-ledger); no new third-party surface.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Already used throughout the host tree for content digests. No new third-party surface.
sha2 = "0.10"
# THE canonical trust-manifest model, its ONE canonical signing-byte function, the production ES256
# verifier and `verify_execution_closure`. Depended on rather than reimplemented: a second opinion
# about which bytes are signed is how a signature scheme quietly becomes decorative.
projectos-host-identity = { path = "../host-identity" }
# THE packaging contract's fixed repository paths. The Host reads the closure artefacts at THESE
# paths, never at the ones an unverified manifest declares — see `run_gatekeeper_review`.
projectos-packaged-runtime-contract = { path = "../packaged-runtime-contract" }
