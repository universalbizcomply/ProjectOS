# ProjectOS Watchdog — outer sentinel workflow (TEMPLATE, NOT ACTIVE).
#
# Canonical source: universalbizcomply/ProjectOS projectos/watchdog/sentinel/.
# projectos/scripts/watchdog-sentinel-package.cjs installs it as
# .github/workflows/watchdog-sentinel.yml in the private sentinel repository
# universalbizcomply/projectos-watchdog-sentinel.
#
# ONE job, ONE lightweight Linux runner, all products probed sequentially.
# No matrix and no per-product jobs (each would multiply billed minutes).
#
# The template itself is never scheduled. The packager uncomments the schedule
# only with an Owner-approved cadence, gated on the Actions budget check:
#   30-minute schedule  "17,47 * * * *"  only if included free minutes suffice
#   hourly fallback     "17 * * * *"     otherwise
#   4-hourly backup     "17 */4 * * *"   Owner choice (21 Sep 2026): the sentinel
#                                        backs up each product's internal Watchdog
# No paid Actions overage is authorised.

name: watchdog-sentinel

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "17,47 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: watchdog-sentinel
  cancel-in-progress: false

jobs:
  sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Probe registered products
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SENTINEL_REMINDER_HOURS: "6"
        run: node sentinel/run-sentinel.ts
